name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run format:check
      - run: shellcheck scripts/*.sh
      - run: npm test
      - run: npm run test:encoder
      - name: Record dependency advisories
        run: node scripts/audit.mjs
      - name: Build and test installable package
        run: bash scripts/build.sh "$PWD/.cache/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64-package
          path: .cache/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-advisories
          path: .cache/npm-audit.json
