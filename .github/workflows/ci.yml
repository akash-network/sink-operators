name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run format:check
      - run: shellcheck scripts/*.sh
      - run: npm test
      - run: npm run test:encoder
      - name: Record dependency advisories
        run: node scripts/audit.mjs
      - name: Build and test installable package
        run: bash scripts/build.sh "$PWD/.cache/package"
      - name: Preserve package permissions
        run: |
          cd .cache
          tar -czf operator-package.tar.gz -C package .
          sha256sum operator-package.tar.gz > operator-package.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-package
          path: |
            .cache/operator-package.tar.gz
            .cache/operator-package.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-advisories
          path: .cache/npm-audit.json
