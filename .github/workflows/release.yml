name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-amd64-package
          path: .cache
      - name: Use the verified package
        run: |
          cd .cache
          sha256sum --check operator-package.sha256
          mkdir package
          tar -xzf operator-package.tar.gz -C package
          test "$(awk '$1 == "commit" {print $2}' package/service-build-info.txt)" = "$(git rev-parse HEAD)"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.17.1
          workdir: .cache/package
          args: release --clean --skip=publish --config ${{ github.workspace }}/.goreleaser.yaml
      - name: Verify installable archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd .cache/release
          sha256sum --check "akt-bridge_${TAG#v}_checksums.txt"
          mkdir ../installed
          tar -xzf "akt-bridge_${TAG#v}_linux_amd64.tar.gz" -C ../installed
          cd "$GITHUB_WORKSPACE"
          bash scripts/test-release.sh "$PWD/.cache/installed"
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "docs/releases/$TAG.md" \
            .cache/release/*.tar.gz .cache/release/*_checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-build-evidence
          path: |
            .cache/release/artifacts.json
            .cache/release/metadata.json
            .cache/package/service-build-info.txt
