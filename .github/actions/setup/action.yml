name: Operator build environment
description: Install the pinned toolchains and build the pinned Akash SDK.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.22.1
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libssl-dev pkg-config python3 shellcheck
        rustup show
        bash scripts/prepare-sdk.sh
        npm ci
